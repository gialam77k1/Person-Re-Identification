name: MSMT17 cross-domain drift

on:
  workflow_dispatch:
    inputs:
      cycle_id:
        description: Control Center cycle ID
        required: false
        default: "manual"
      dataset:
        description: Target dataset
        required: true
        default: MSMT17
      sample_size:
        description: Deterministic MSMT17 query sample size
        required: true
        default: "1000"
      release_id:
        description: Model release ID
        required: true
        default: market1501-vit-bnneck:v1-dvc

permissions:
  contents: read

concurrency:
  group: msmt17-cross-domain-drift
  cancel-in-progress: false

jobs:
  detect-drift:
    runs-on: [self-hosted, linux]
    timeout-minutes: 240
    env:
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'http://localhost:8090' }}
      CONTROL_CALLBACK_TOKEN: ${{ secrets.CONTROL_CALLBACK_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark data validation running
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" validate_data RUNNING
          --detail "Checking MSMT17, model v1 and serving stack"

      - name: Configure local MLOps credentials
        env:
          MLOPS_ENV_FILE: ${{ secrets.MLOPS_ENV_FILE }}
        run: |
          test -n "$MLOPS_ENV_FILE"
          printf '%s\n' "$MLOPS_ENV_FILE" > .env.mlops
          chmod 600 .env.mlops

      - name: Start serving stack
        run: ./scripts/mlops_stack.sh up

      - name: Mark data validation complete
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" validate_data PASS
          --progress 1 --detail "Dataset and serving stack are ready"

      - name: Mark drift stages running
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" extract_embeddings RUNNING --detail "Capturing MSMT17 query embeddings"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" detect_drift RUNNING --detail "Comparing MSMT17 against Market-1501 reference"

      - name: Capture MSMT17 embeddings and detect drift
        env:
          CONTROL_CYCLE_ID: ${{ inputs.cycle_id }}
          SAMPLE_SIZE: ${{ inputs.sample_size }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: ./scripts/cross_dataset_drift.sh

      - name: Mark drift stages complete
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" extract_embeddings PASS --progress 1 --detail "MSMT17 embeddings captured"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" detect_drift PASS --progress 1 --detail "Drift report generated"

      - name: Evaluate model v1 on MSMT17
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v1 RUNNING --detail "Running full MSMT17 deployment evaluation"
          ./scripts/evaluate_msmt17_v1.sh
          ./scripts/retraining_decision.sh

      - name: Build immutable retraining evidence
        run: |
          python src/retraining_evidence.py build \
            --cycle-id "${{ inputs.cycle_id }}" \
            --release-id "${{ inputs.release_id }}" \
            --dataset "${{ inputs.dataset }}" \
            --drift-report artifacts/cross-domain/market1501-v1-on-msmt17/drift/drift_report.json \
            --evaluation-report artifacts/cross-domain/market1501-v1-on-msmt17/metrics/v1_on_msmt17.json \
            --decision artifacts/cross-domain/market1501-v1-on-msmt17/retraining/decision.json \
            --base-manifest artifacts/pipeline/market1501-vit-bnneck-v1-dvc/release/model_manifest.json \
            --source-commit "${{ github.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --output artifacts/cross-domain/market1501-v1-on-msmt17/retraining/bundle/evidence_manifest.json

      - name: Mark evidence ready for approval
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v1 PASS
          --progress 1 --detail "Evidence ready for retraining approval"
          --metrics '{"workflow_run_id":"${{ github.run_id }}","artifact_name":"mlops-evidence-${{ inputs.cycle_id }}"}'

      - name: Upload drift evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlops-evidence-${{ inputs.cycle_id }}
          path: |
            artifacts/cross-domain/market1501-v1-on-msmt17/retraining/bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary credential file
        if: ${{ always() }}
        run: rm -f .env.mlops

      - name: Report pre-approval failure
        if: ${{ failure() }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v1 FAIL
          --detail "Pre-approval workflow failed; inspect GitHub Actions logs"
