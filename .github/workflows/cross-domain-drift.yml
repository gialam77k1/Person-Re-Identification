name: DukeMTMC-reID cross-domain drift

on:
  workflow_dispatch:
    inputs:
      cycle_id:
        description: Control Center cycle ID
        required: false
        default: "manual"
      dataset:
        description: Target dataset
        required: true
        default: dukemtmc-reid
      sample_size:
        description: Deterministic DukeMTMC-reID query sample size
        required: true
        default: "1000"
      release_id:
        description: Model release ID
        required: true
        default: market1501-vit-bnneck:v1-dvc
      inbox_batch_id:
        description: Data Inbox batch record
        required: false
        default: ""
      dataset_revision:
        description: Immutable batch fingerprint
        required: false
        default: ""
      dataset_path:
        description: Batch path relative to CONTROL_HOST_DATASET_ROOT
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: duke-cross-domain-drift
  cancel-in-progress: false

jobs:
  detect-drift:
    runs-on: [self-hosted, linux]
    timeout-minutes: 240
    env:
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'http://localhost:8090' }}
      CONTROL_CALLBACK_TOKEN: ${{ secrets.CONTROL_CALLBACK_TOKEN }}
      INBOX_BATCH_ID: ${{ inputs.inbox_batch_id }}
      INBOX_DATASET_REVISION: ${{ inputs.dataset_revision }}
      INBOX_DATASET_PATH: ${{ inputs.dataset_path }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark data validation running
        run: >-
          test "${{ inputs.dataset }}" = "dukemtmc-reid" &&
          python scripts/control_callback.py "${{ inputs.cycle_id }}" validate_data RUNNING
          --detail "Checking DukeMTMC-reID, model v1 and serving stack"

      - name: Configure local MLOps credentials
        env:
          MLOPS_ENV_FILE: ${{ secrets.MLOPS_ENV_FILE }}
        run: |
          test -n "$MLOPS_ENV_FILE"
          printf '%s\n' "$MLOPS_ENV_FILE" > .env.mlops
          chmod 600 .env.mlops

      - name: Verify persistent serving stack
        run: ./scripts/mlops_stack.sh verify

      - name: Mark data validation complete
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" validate_data PASS
          --progress 1 --detail "Dataset and serving stack are ready"

      - name: Mark drift stages running
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" extract_embeddings RUNNING --detail "Capturing DukeMTMC-reID query embeddings"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" detect_drift RUNNING --detail "Comparing DukeMTMC-reID against Market-1501 reference"

      - name: Capture DukeMTMC-reID embeddings and detect drift
        env:
          CONTROL_CYCLE_ID: ${{ inputs.cycle_id }}
          SAMPLE_SIZE: ${{ inputs.sample_size }}
          RELEASE_ID: ${{ inputs.release_id }}
          LOG_DRIFT_MLFLOW: "1"
        run: |
          set -a
          source .env.mlops
          set +a
          ./scripts/cross_dataset_drift.sh

      - name: Mark drift stages complete
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" extract_embeddings PASS --progress 1 --detail "DukeMTMC-reID embeddings captured"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" detect_drift PASS --progress 1 --detail "Drift detected and recorded in Prometheus/MLflow" --metrics-file artifacts/cross-domain/market1501-v1-on-duke/drift/drift_report.json

      - name: Evaluate model v1 on DukeMTMC-reID
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          DATASET_POINTER: ${{ runner.temp }}/reid-inbox-${{ inputs.cycle_id }}/inbox_dataset.dvc
        run: |
          if [[ -z "${{ inputs.dataset_path }}" ]]; then
            export DATASET_POINTER=datasets/dukemtmc-reid.dvc
          fi
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v1 RUNNING --detail "Running full DukeMTMC-reID deployment evaluation"
          ./scripts/evaluate_duke_v1.sh
          ./scripts/retraining_decision.sh

      - name: Build immutable retraining evidence
        run: |
          ./scripts/dvc_local.sh pull validate_release
          python src/retraining_evidence.py build \
            --cycle-id "${{ inputs.cycle_id }}" \
            --release-id "${{ inputs.release_id }}" \
            --dataset "${{ inputs.dataset }}" \
            --drift-report artifacts/cross-domain/market1501-v1-on-duke/drift/drift_report.json \
            --evaluation-report artifacts/cross-domain/market1501-v1-on-duke/metrics/v1_on_duke.json \
            --decision artifacts/cross-domain/market1501-v1-on-duke/retraining/decision.json \
            --base-manifest artifacts/pipeline/market1501-vit-bnneck-v1-dvc/release/model_manifest.json \
            --source-commit "${{ github.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --output artifacts/cross-domain/market1501-v1-on-duke/retraining/bundle/evidence_manifest.json

      - name: Upload drift evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlops-evidence-${{ inputs.cycle_id }}
          path: |
            artifacts/cross-domain/market1501-v1-on-duke/retraining/bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Mark evidence ready for approval
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v1 PASS
          --progress 1 --detail "Evidence uploaded and ready for retraining approval"
          --metrics-file artifacts/cross-domain/market1501-v1-on-duke/retraining/decision.json
          --metrics-file evaluation=artifacts/cross-domain/market1501-v1-on-duke/metrics/v1_on_duke.json
          --metrics '{"workflow_run_id":"${{ github.run_id }}","artifact_name":"mlops-evidence-${{ inputs.cycle_id }}"}'

      - name: Remove temporary credential file
        if: ${{ always() }}
        run: rm -f .env.mlops

      - name: Report pre-approval failure
        if: ${{ failure() || cancelled() }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v1 FAIL
          --detail "Pre-approval workflow failed or was cancelled; inspect GitHub Actions logs"
