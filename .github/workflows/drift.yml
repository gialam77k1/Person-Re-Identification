name: Embedding drift report

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      release_id:
        description: Optional release override; scheduled runs auto-detect the serving release
        required: false
        default: ""
      release_slug:
        description: Optional matching DVC pipeline slug
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: embedding-drift-report
  cancel-in-progress: false

jobs:
  drift-report:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Configure local MLOps credentials
        env:
          MLOPS_ENV_FILE: ${{ secrets.MLOPS_ENV_FILE }}
        run: |
          test -n "$MLOPS_ENV_FILE"
          printf '%s\n' "$MLOPS_ENV_FILE" > .env.mlops
          chmod 600 .env.mlops

      - name: Generate drift report and Prometheus metrics
        env:
          RELEASE_ID: ${{ inputs.release_id || '' }}
          RELEASE_SLUG: ${{ inputs.release_slug || '' }}
        run: ./scripts/drift_report_local.sh "$RELEASE_ID" "$RELEASE_SLUG"
