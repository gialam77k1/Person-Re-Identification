name: Release model service

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Model release ID (name:version)
        required: true
        default: market1501-vit-bnneck:v1-dvc
      release_slug:
        description: DVC pipeline release directory
        required: true
        default: market1501-vit-bnneck-v1-dvc
      cycle_id:
        description: Control Center cycle ID
        required: false
        default: manual

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.release_id }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: reid-api

jobs:
  validate-candidate:
    name: Validate model candidate
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Configure local MLOps credentials
        env:
          MLOPS_ENV_FILE: ${{ secrets.MLOPS_ENV_FILE }}
        run: |
          test -n "$MLOPS_ENV_FILE"
          printf '%s\n' "$MLOPS_ENV_FILE" > .env.mlops
          chmod 600 .env.mlops

      - name: Locate immutable candidate artifact
        if: ${{ inputs.cycle_id != 'manual' }}
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: duke-v2-retraining-reports-${{ inputs.cycle_id }}
        run: |
          run_id="$(python -m src.find_candidate_artifact \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-name "$ARTIFACT_NAME")"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Download immutable candidate lineage
        if: ${{ inputs.cycle_id != 'manual' }}
        uses: actions/download-artifact@v4
        with:
          name: duke-v2-retraining-reports-${{ inputs.cycle_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          path: .candidate-release

      - name: Pull candidate artifacts from DVC
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SLUG: ${{ inputs.release_slug }}
          CANDIDATE_REPORTS_ROOT: ${{ inputs.cycle_id != 'manual' && '.candidate-release' || '' }}
        run: ./scripts/materialize_release_artifacts.sh

      - name: Enforce validation gate
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SLUG: ${{ inputs.release_slug }}
        run: >-
          conda run --no-capture-output -n reid python src/release_deployment.py verify
          --release-id "$RELEASE_ID"
          --validation-report "artifacts/pipeline/${RELEASE_SLUG}/release/validation_report.json"
          --manifest "artifacts/pipeline/${RELEASE_SLUG}/release/model_manifest.json"

  build-image:
    name: Build and publish immutable API image
    needs: validate-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Create immutable image reference
        id: image
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${RELEASE_ID#*:}"
          version="$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')"
          reference="${REGISTRY}/${owner}/${IMAGE_NAME}:${GITHUB_SHA::7}-model-${version}"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build image
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: docker build --file docker/api/Dockerfile --tag "$IMAGE" .

      - name: Smoke-test image without GPU
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: >-
          docker run --rm --entrypoint python "$IMAGE" -c
          "from src.api.main import app; schema=app.openapi();
          expected={'/health','/ready','/model-info','/embed','/search'};
          assert expected <= set(schema['paths']); print('Container smoke: PASS')"

      - name: Publish image
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: docker push "$IMAGE"

  deploy-staging:
    name: Deploy and smoke-test staging
    needs: build-image
    runs-on: [self-hosted, linux]
    environment: staging
    timeout-minutes: 45
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Configure local MLOps credentials
        env:
          MLOPS_ENV_FILE: ${{ secrets.MLOPS_ENV_FILE }}
        run: |
          test -n "$MLOPS_ENV_FILE"
          printf '%s\n' "$MLOPS_ENV_FILE" > .env.mlops
          chmod 600 .env.mlops

      - name: Locate immutable candidate artifact
        if: ${{ inputs.cycle_id != 'manual' }}
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: duke-v2-retraining-reports-${{ inputs.cycle_id }}
        run: |
          run_id="$(python -m src.find_candidate_artifact \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-name "$ARTIFACT_NAME")"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Download immutable candidate lineage
        if: ${{ inputs.cycle_id != 'manual' }}
        uses: actions/download-artifact@v4
        with:
          name: duke-v2-retraining-reports-${{ inputs.cycle_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          path: .candidate-release

      - name: Pull deployment artifacts
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SLUG: ${{ inputs.release_slug }}
          CANDIDATE_REPORTS_ROOT: ${{ inputs.cycle_id != 'manual' && '.candidate-release' || '' }}
        run: ./scripts/materialize_release_artifacts.sh

      - name: Authenticate image pull
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Deploy staging
        env:
          IMAGE: ${{ needs.build-image.outputs.image }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SLUG: ${{ inputs.release_slug }}
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" deploy_staging RUNNING --detail "Deploying validated candidate to staging"
          ./scripts/deploy_local.sh deploy \
            --environment staging \
            --image "$IMAGE" \
            --image-git-commit "$GITHUB_SHA" \
            --release-id "$RELEASE_ID" \
            --validation-report "artifacts/pipeline/${RELEASE_SLUG}/release/validation_report.json" \
            --manifest "artifacts/pipeline/${RELEASE_SLUG}/release/model_manifest.json" \
            --triton-model-repository "artifacts/pipeline/${RELEASE_SLUG}/triton/model_repository"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" deploy_staging PASS --progress 1 --detail "Staging deployment completed"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" staging_test PASS --progress 1 --detail "Staging deployment smoke checks passed"

  deploy-production:
    name: Approve and deploy production
    needs: [build-image, deploy-staging]
    runs-on: [self-hosted, linux]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Configure local MLOps credentials
        env:
          MLOPS_ENV_FILE: ${{ secrets.MLOPS_ENV_FILE }}
        run: |
          test -n "$MLOPS_ENV_FILE"
          printf '%s\n' "$MLOPS_ENV_FILE" > .env.mlops
          chmod 600 .env.mlops

      - name: Locate immutable candidate artifact
        if: ${{ inputs.cycle_id != 'manual' }}
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: duke-v2-retraining-reports-${{ inputs.cycle_id }}
        run: |
          run_id="$(python -m src.find_candidate_artifact \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-name "$ARTIFACT_NAME")"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Download immutable candidate lineage
        if: ${{ inputs.cycle_id != 'manual' }}
        uses: actions/download-artifact@v4
        with:
          name: duke-v2-retraining-reports-${{ inputs.cycle_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          path: .candidate-release

      - name: Pull deployment artifacts
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SLUG: ${{ inputs.release_slug }}
          CANDIDATE_REPORTS_ROOT: ${{ inputs.cycle_id != 'manual' && '.candidate-release' || '' }}
        run: ./scripts/materialize_release_artifacts.sh

      - name: Authenticate image pull
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Deploy production
        env:
          IMAGE: ${{ needs.build-image.outputs.image }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_SLUG: ${{ inputs.release_slug }}
        run: >-
          ./scripts/deploy_local.sh deploy
          --environment production
          --image "$IMAGE"
          --image-git-commit "$GITHUB_SHA"
          --release-id "$RELEASE_ID"
          --validation-report "artifacts/pipeline/${RELEASE_SLUG}/release/validation_report.json"
          --manifest "artifacts/pipeline/${RELEASE_SLUG}/release/model_manifest.json"
          --triton-model-repository "artifacts/pipeline/${RELEASE_SLUG}/triton/model_repository"

      - name: Promote validated registry release to champion
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -a
          source .env.mlops
          set +a
          conda run --no-capture-output -n reid python -m src.promote_registry_release \
            --release-id "$RELEASE_ID" \
            --alias champion \
            --tracking-uri "${MLFLOW_TRACKING_URI:-http://localhost:5000}" \
            --output "artifacts/deployments/production/registry_promotion.json"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" production_approval PASS \
            --progress 1 --detail "Production deployed; MLflow champion now points to $RELEASE_ID"

  report-release-failure:
    name: Report release failure to Control Center
    needs: [validate-candidate, build-image, deploy-staging, deploy-production]
    if: >-
      ${{ always() && inputs.cycle_id != 'manual' &&
      (needs.validate-candidate.result == 'failure' ||
      needs.validate-candidate.result == 'cancelled' ||
      needs.build-image.result == 'failure' ||
      needs.build-image.result == 'cancelled' ||
      needs.deploy-staging.result == 'failure' ||
      needs.deploy-staging.result == 'cancelled' ||
      needs.deploy-production.result == 'failure' ||
      needs.deploy-production.result == 'cancelled') }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Configure local MLOps credentials
        env:
          MLOPS_ENV_FILE: ${{ secrets.MLOPS_ENV_FILE }}
        run: |
          test -n "$MLOPS_ENV_FILE"
          printf '%s\n' "$MLOPS_ENV_FILE" > .env.mlops
          chmod 600 .env.mlops

      - name: Mark production approval failed
        env:
          VALIDATE_RESULT: ${{ needs.validate-candidate.result }}
          BUILD_RESULT: ${{ needs.build-image.result }}
          STAGING_RESULT: ${{ needs.deploy-staging.result }}
          PRODUCTION_RESULT: ${{ needs.deploy-production.result }}
        run: |
          set -a
          source .env.mlops
          set +a
          detail="Release failed: validate=${VALIDATE_RESULT}, build=${BUILD_RESULT}, staging=${STAGING_RESULT}, production=${PRODUCTION_RESULT}"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" production_approval FAIL --detail "$detail"
