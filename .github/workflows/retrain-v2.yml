name: Retrain next DukeMTMC-reID model version

on:
  workflow_dispatch:
    inputs:
      cycle_id:
        description: Control Center cycle ID
        required: true
      source_release:
        description: Source model release
        required: true
      target_release:
        description: Target model release
        required: true
      dataset:
        description: Target dataset
        required: true
      evidence_run_id:
        description: GitHub run that produced immutable pre-approval evidence
        required: true
      evidence_artifact:
        description: Exact pre-approval artifact name
        required: true
      evidence_git_commit:
        description: Git commit locked by the approved evidence
        required: true
      drift_report:
        description: Drift report path inside the downloaded artifact
        required: true
      evaluation_report:
        description: Evaluation report path inside the downloaded artifact
        required: true
      decision:
        description: Destination path for the approved Control API decision
        required: true
      decision_sha256:
        description: Canonical SHA256 of the approved decision
        required: true
      inbox_batch_id:
        description: Data Inbox batch record
        required: false
        default: ""
      dataset_revision:
        description: Immutable batch fingerprint
        required: false
        default: ""
      dataset_path:
        description: Batch path relative to CONTROL_HOST_DATASET_ROOT
        required: false
        default: ""
      dataset_host_path:
        description: Absolute batch path on the self-hosted runner
        required: false
        default: ""
      resume_training_run_id:
        description: Completed MLflow run ID; restores training artifacts and resumes at evaluation
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: retrain-duke-${{ inputs.target_release }}
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: [self-hosted, linux]
    timeout-minutes: 1440
    env:
      CONTROL_CYCLE_ID: ${{ inputs.cycle_id }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'http://localhost:8090' }}
      CONTROL_CALLBACK_TOKEN: ${{ secrets.CONTROL_CALLBACK_TOKEN }}
      # Reduce CUDA allocator fragmentation on the long-lived self-hosted runner.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:128
      INBOX_CONFIG: configs/runtime/duke_v2_inbox_${{ inputs.cycle_id }}.yaml
      TARGET_DATASET: ${{ inputs.dataset }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          clean: false
          # New GPU training executes the exact code that produced the
          # approved evidence. Recovery may use newer post-training fixes.
          ref: ${{ inputs.resume_training_run_id == '' && inputs.evidence_git_commit || github.sha }}
          fetch-depth: 1

      - name: Verify execution commit policy
        env:
          EVIDENCE_GIT_COMMIT: ${{ inputs.evidence_git_commit }}
          RESUME_TRAINING_RUN_ID: ${{ inputs.resume_training_run_id }}
        run: |
          [[ "$EVIDENCE_GIT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          execution_commit="$(git rev-parse HEAD)"
          if [[ -z "$RESUME_TRAINING_RUN_ID" && "$execution_commit" != "$EVIDENCE_GIT_COMMIT" ]]; then
            echo "Fresh training checkout ${execution_commit} does not match approved evidence ${EVIDENCE_GIT_COMMIT}" >&2
            exit 2
          fi
          echo "EXECUTION_GIT_COMMIT=${execution_commit}" >> "$GITHUB_ENV"

      - name: Resolve runner runtime paths
        run: |
          base_checkpoint="${RUNNER_TEMP}/reid-base-${{ inputs.cycle_id }}/best_model.pth"
          inbox_root="${RUNNER_TEMP}/reid-inbox-${{ inputs.cycle_id }}/dataset"
          inbox_pointer="${RUNNER_TEMP}/reid-inbox-${{ inputs.cycle_id }}/inbox_dataset.dvc"
          {
            echo "BASE_CHECKPOINT=${base_checkpoint}"
            echo "INBOX_DATASET_ROOT=${inbox_root}"
            echo "INBOX_DATASET_POINTER=${inbox_pointer}"
            if [[ -n '${{ inputs.dataset_path }}' ]]; then
              echo "CONFIG_PATH=${INBOX_CONFIG}"
              echo "DATASET_PATH=${inbox_root}"
              echo "DATASET_DVC_PATH=${inbox_pointer}"
            else
              echo "CONFIG_PATH=configs/duke_v2_train.yaml"
              echo "DATASET_PATH=datasets/dukemtmc-reid"
              echo "DATASET_DVC_PATH=datasets/dukemtmc-reid.dvc"
            fi
          } >> "$GITHUB_ENV"

      - name: Configure local MLOps credentials
        env:
          MLOPS_ENV_FILE: ${{ secrets.MLOPS_ENV_FILE }}
        run: |
          test -n "$MLOPS_ENV_FILE"
          printf '%s\n' "$MLOPS_ENV_FILE" > .env.mlops
          chmod 600 .env.mlops

      - name: Resolve immutable release paths
        run: |
          target='${{ inputs.target_release }}'
          [[ "$target" =~ ^[A-Za-z0-9._-]+:v([0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          slug="${target//:/-}"
          run_root="artifacts/duke/${slug}"
          pipeline_root="artifacts/pipeline/${slug}"
          {
            echo "TARGET_VERSION=${version}"
            echo "TARGET_SLUG=${slug}"
            echo "V2_ROOT=${run_root}"
            echo "V2_PIPELINE_ROOT=${pipeline_root}"
            echo "RUN_ROOT=${run_root}"
            echo "CHECKPOINT=${run_root}/checkpoints/best_model.pth"
            echo "RELEASE_ID=${target}"
            echo "CHECKPOINT_DVC_PATH="
            echo "DUKE_V2_REPORT=${run_root}/evaluations/duke/metrics/evaluation_duke.json"
            echo "MARKET1501_V2_REPORT=${run_root}/evaluations/market1501/metrics/evaluation_market1501.json"
            echo "FORGETTING_REPORT=${run_root}/release/catastrophic_forgetting_report.json"
            echo "DUKE_EVAL_CONFIG=configs/runtime/${{ inputs.cycle_id }}/duke-eval.yaml"
            echo "MARKET1501_EVAL_CONFIG=configs/runtime/${{ inputs.cycle_id }}/market1501-eval.yaml"
          } >> "$GITHUB_ENV"

      - name: Prepare version-neutral evaluation configs
        run: |
          python -m src.prepare_candidate_evaluation \
            --template configs/duke_v2_eval.yaml \
            --output "$DUKE_EVAL_CONFIG" \
            --source-release '${{ inputs.source_release }}' \
            --target-release '${{ inputs.target_release }}' \
            --run-root "$V2_ROOT/evaluations/duke"
          python -m src.prepare_candidate_evaluation \
            --template configs/market1501_v2_eval.yaml \
            --output "$MARKET1501_EVAL_CONFIG" \
            --source-release '${{ inputs.source_release }}' \
            --target-release '${{ inputs.target_release }}' \
            --run-root "$V2_ROOT/evaluations/market1501"

      - name: Download exact pre-approval evidence
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.evidence_artifact }}
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: evidence

      - name: Materialize versioned dataset
        run: |
          ./scripts/dvc_local.sh pull datasets/dukemtmc-reid.dvc

      - name: Materialize source champion checkpoint
        run: |
          mkdir -p "$(dirname "$BASE_CHECKPOINT")"
          if [[ '${{ inputs.source_release }}' == market1501-vit-bnneck:v1* ]]; then
            pointer=artifacts/market1501/market1501-vit-bnneck-v1/checkpoints/best_model.pth.dvc
            ./scripts/dvc_local.sh pull "$pointer"
            cp "${pointer%.dvc}" "$BASE_CHECKPOINT"
          else
            set -a
            source .env.mlops
            set +a
            conda run --no-capture-output -n reid python -m src.materialize_registry_checkpoint \
              --release-id '${{ inputs.source_release }}' \
              --destination "$BASE_CHECKPOINT" \
              --tracking-uri "${MLFLOW_TRACKING_URI:-http://localhost:5000}" \
              --output "${RUNNER_TEMP}/source-release-${{ inputs.cycle_id }}.json"
          fi
          test -s "$BASE_CHECKPOINT"

      - name: Prepare generic vN to vN+1 workspace
        run: |
          python -m src.prepare_iterative_release \
            --source-release '${{ inputs.source_release }}' \
            --target-release '${{ inputs.target_release }}' \
            --checkpoint "$BASE_CHECKPOINT" \
            --run-root "$V2_ROOT" \
            --dataset-root "$INBOX_DATASET_ROOT" \
            --dataset-pointer "$INBOX_DATASET_POINTER" \
            --output "${RUNNER_TEMP}/release-lineage-${{ inputs.cycle_id }}.json"

      - name: Build immutable Data Inbox training view
        if: ${{ inputs.dataset_path != '' }}
        run: |
          test -n "${{ inputs.dataset_host_path }}"
          conda run --no-capture-output -n reid python -m src.prepare_inbox_dataset \
            --source "${{ inputs.dataset_host_path }}" \
            --base-dataset datasets/dukemtmc-reid \
            --base-config configs/duke_v2_train.yaml \
            --output-root "${INBOX_DATASET_ROOT}" \
            --output-config "${INBOX_CONFIG}" \
            --output-pointer "${INBOX_DATASET_POINTER}" \
            --revision "${{ inputs.dataset_revision }}" \
            --source-release '${{ inputs.source_release }}' \
            --target-release '${{ inputs.target_release }}' \
            --base-checkpoint "$BASE_CHECKPOINT" \
            --run-root "$V2_ROOT" \
            --dataset-name '${{ inputs.dataset }}'

      - name: Bind candidate evaluation to the held-out inbox split
        if: ${{ inputs.dataset_path != '' }}
        run: |
          python -m src.prepare_candidate_evaluation \
            --template configs/duke_v2_eval.yaml \
            --data-config "$INBOX_CONFIG" \
            --output "$DUKE_EVAL_CONFIG" \
            --source-release '${{ inputs.source_release }}' \
            --target-release '${{ inputs.target_release }}' \
            --run-root "$V2_ROOT/evaluations/duke"

      - name: Verify Git, DVC, dataset and checkpoint lineage
        id: evidence_lineage
        run: |
          lineage_args=(
            --manifest evidence/evidence_manifest.json
            --cycle-id "${{ inputs.cycle_id }}"
            --release-id "${{ inputs.source_release }}"
            --dataset "${{ inputs.dataset }}"
            --current-commit "${EXECUTION_GIT_COMMIT}"
            --dataset-pointer "${DATASET_DVC_PATH}"
            --base-checkpoint "${BASE_CHECKPOINT}"
          )
          if [[ -n '${{ inputs.resume_training_run_id }}' ]]; then
            # Training is already FINISHED and immutable in MLflow. A recovery
            # checkout may intentionally contain a newer evaluation-only fix.
            lineage_args+=(--allow-source-commit-mismatch)
          fi
          python -m src.retraining_evidence verify "${lineage_args[@]}"

      - name: Fetch and verify approved decision from Control API
        run: |
          curl --fail --silent --show-error \
            -H "X-Control-Callback-Token: ${CONTROL_CALLBACK_TOKEN}" \
            "${CONTROL_API_URL}/control/cycles/${{ inputs.cycle_id }}/retraining-decision" \
            --output "${{ inputs.decision }}"
          python -m src.verify_approved_decision \
            --decision "${{ inputs.decision }}" \
            --evidence-manifest evidence/evidence_manifest.json \
            --decision-sha256 "${{ inputs.decision_sha256 }}" \
            --cycle-id "${{ inputs.cycle_id }}" \
            --source-release "${{ inputs.source_release }}" \
            --target-release "${{ inputs.target_release }}" \
            --dataset "${{ inputs.dataset }}" \
            --target-epochs 50

      - name: Preflight next-version training
        if: ${{ inputs.resume_training_run_id == '' }}
        env:
          DECISION_PATH: evidence/approved_decision.json
        run: ./scripts/train_duke_v2_local.sh --check

      - name: Preflight every post-training contract before GPU training
        run: |
          python -m src.validate_post_training_contract \
            --release-id "$RELEASE_ID" \
            --duke-config "$DUKE_EVAL_CONFIG" \
            --duke-report "$DUKE_V2_REPORT" \
            --market-config "$MARKET1501_EVAL_CONFIG" \
            --market-report "$MARKET1501_V2_REPORT" \
            --forgetting-policy configs/catastrophic_forgetting.yaml \
            --validation-policy configs/retraining_validation.yaml \
            --target-dataset '${{ inputs.dataset }}'
          bash -n scripts/evaluate_duke_v2.sh
          bash -n scripts/evaluate_market1501_v2.sh
          bash -n scripts/evaluate_v2_dual_domain.sh

      - name: Restore completed training run from MLflow
        id: restore
        if: ${{ inputs.resume_training_run_id != '' }}
        run: |
          set -a
          source .env.mlops
          set +a
          conda run --no-capture-output -n reid python -m src.materialize_training_run \
            --run-id '${{ inputs.resume_training_run_id }}' \
            --release-id "$RELEASE_ID" \
            --run-root "$V2_ROOT" \
            --tracking-uri "${MLFLOW_TRACKING_URI:-http://localhost:5000}"

      - name: Train next model version
        id: train
        if: ${{ inputs.resume_training_run_id == '' }}
        env:
          DECISION_PATH: evidence/approved_decision.json
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" train_v2 RUNNING --detail "Approved retraining started"
          ./scripts/train_duke_v2_local.sh

      - name: Report training failure
        if: ${{ (failure() || cancelled()) && (steps.train.outcome == 'failure' || steps.train.outcome == 'cancelled') }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" train_v2 FAIL
          --detail "Model v2 training failed or was cancelled; inspect runner RAM and MLflow logs"

      - name: Mark training complete
        run: |
          if [[ -z '${{ inputs.resume_training_run_id }}' ]]; then
            conda run --no-capture-output -n reid python -m src.validate_v2_training_completion \
              --run-root "${V2_ROOT}" \
              --output "${V2_ROOT}/logs/training_completion_report.json"
            completion_report="${V2_ROOT}/logs/training_completion_report.json"
          else
            completion_report="${V2_ROOT}/logs/training_restore_report.json"
          fi
          python scripts/control_callback.py "${{ inputs.cycle_id }}" train_v2 PASS \
            --progress 1 --detail "Completed training artifacts are ready; continuing without retraining" \
            --metrics-file "${completion_report}"

      - name: Evaluate candidate on DukeMTMC-reID and Market-1501
        id: evaluate
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v2 RUNNING --detail "Evaluating the same v2 checkpoint on DukeMTMC-reID and Market-1501"
          set +e
          ./scripts/evaluate_v2_dual_domain.sh 2>&1 | tee "${RUNNER_TEMP}/evaluate-v2-${{ inputs.cycle_id }}.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            tail -n 1 "${RUNNER_TEMP}/evaluate-v2-${{ inputs.cycle_id }}.log" \
              > "${RUNNER_TEMP}/evaluate-v2-${{ inputs.cycle_id }}.error"
            exit "$status"
          fi

      - name: Report evaluation failure
        if: ${{ (failure() || cancelled()) && (steps.evaluate.outcome == 'failure' || steps.evaluate.outcome == 'cancelled') }}
        run: |
          detail="Candidate evaluation failed"
          error_file="${RUNNER_TEMP}/evaluate-v2-${{ inputs.cycle_id }}.error"
          if [[ -s "$error_file" ]]; then
            detail="$(cat "$error_file")"
          fi
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v2 FAIL \
            --detail "$detail"

      - name: Check improvement and catastrophic forgetting
        id: quality_gate
        run: |
          set +e
          conda run --no-capture-output -n reid python -m src.catastrophic_forgetting_gate \
            --duke-v1 "${{ inputs.evaluation_report }}" \
            --duke-v2 "${DUKE_V2_REPORT}" \
            --market1501-v1-manifest model_releases/market1501-vit-bnneck/v1/model_manifest.json \
            --market1501-v2 "${MARKET1501_V2_REPORT}" \
            --policy configs/catastrophic_forgetting.yaml \
            --mlflow-run "${V2_ROOT}/logs/mlflow_run.json" \
            --output "${FORGETTING_REPORT}"
          gate_status=$?
          set -e
          conda run --no-capture-output -n reid python -m src.log_v2_evaluations_mlflow \
            --duke "${DUKE_V2_REPORT}" \
            --market1501 "${MARKET1501_V2_REPORT}" \
            --gate "${FORGETTING_REPORT}" \
            --policy configs/catastrophic_forgetting.yaml \
            --mlflow-run "${V2_ROOT}/logs/mlflow_run.json" \
            --output "${V2_ROOT}/logs/evaluation_mlflow.json"
          if [[ "${gate_status}" -ne 0 ]]; then
            python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v2 FAIL \
              --detail "Catastrophic-forgetting gate failed; reports are preserved in MLflow" \
              --metrics-file "${FORGETTING_REPORT}" \
              --metrics-file "duke=${DUKE_V2_REPORT}" \
              --metrics-file "market1501=${MARKET1501_V2_REPORT}"
            exit "${gate_status}"
          fi
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v2 PASS \
            --progress 1 --detail "Cross-domain improvement and retention gates passed" \
            --metrics-file "${FORGETTING_REPORT}" \
            --metrics-file "duke=${DUKE_V2_REPORT}" \
            --metrics-file "market1501=${MARKET1501_V2_REPORT}"

      - name: Run retraining lineage gate
        id: lineage_gate
        run: |
          python -m src.retraining_validation_gate \
            --evidence evidence/evidence_manifest.json \
            --decision evidence/approved_decision.json \
            --training-metrics "${V2_ROOT}/metrics/metrics_v2.json" \
            --evaluation-metrics "${DUKE_V2_REPORT}" \
            --baseline-evaluation "${{ inputs.evaluation_report }}" \
            --mlflow-run "${V2_ROOT}/logs/mlflow_run.json" \
            --config "${{ inputs.dataset_path != '' && env.INBOX_CONFIG || 'configs/duke_v2_train.yaml' }}" \
            --policy configs/retraining_validation.yaml \
            --base-checkpoint "${BASE_CHECKPOINT}" \
            --candidate-checkpoint "${V2_ROOT}/checkpoints/best_model.pth" \
            --git-commit '${{ inputs.evidence_git_commit }}' \
            --output "${V2_ROOT}/release/validation_report.json" \
            --manifest-output "${V2_ROOT}/release/model_manifest.json"

      - name: Report lineage validation failure
        if: ${{ (failure() || cancelled()) && (steps.lineage_gate.outcome == 'failure' || steps.lineage_gate.outcome == 'cancelled') }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" validate_release FAIL
          --detail "Retraining lineage validation failed; evidence, decision, checkpoint or config checksum did not match"

      - name: Export, verify and validate candidate release
        id: release_gate
        run: |
          mkdir -p artifacts/cross-domain/market1501-v1-on-duke/metrics
          cp "${{ inputs.evaluation_report }}" \
            artifacts/cross-domain/market1501-v1-on-duke/metrics/v1_on_duke.json
          python scripts/control_callback.py "${{ inputs.cycle_id }}" export_onnx RUNNING \
            --detail "Exporting ONNX external weights, checking parity and extracting reference embeddings"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" validate_release RUNNING \
            --detail "Running immutable v2 quality, contract, lineage and checksum policy"
          ./scripts/dvc_local.sh repro v2_package_triton
          python scripts/control_callback.py "${{ inputs.cycle_id }}" export_onnx PASS \
            --progress 1 --detail "ONNX export, parity and reference extraction passed" \
            --metrics-file "${V2_PIPELINE_ROOT}/parity/metrics/onnx_parity.json"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" validate_release PASS \
            --progress 1 --detail "Full v2 release validation gate PASS" \
            --metrics-file "${V2_PIPELINE_ROOT}/release/validation_report.json"

      - name: Report release validation failure
        if: ${{ (failure() || cancelled()) && (steps.release_gate.outcome == 'failure' || steps.release_gate.outcome == 'cancelled') }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" validate_release FAIL
          --detail "ONNX export, parity, reference extraction or immutable release validation failed"

      - name: Persist large candidate artifacts with DVC
        id: publish
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" publish_artifacts RUNNING \
            --detail "Publishing the complete v2 release graph to DVC / MinIO"
          ./scripts/publish_v2_artifacts.sh
          python scripts/control_callback.py "${{ inputs.cycle_id }}" publish_artifacts PASS \
            --progress 1 --detail "DVC remote is clean and publication evidence is versioned" \
            --metrics-file "${V2_PIPELINE_ROOT}/release/dvc_publication.json"

      - name: Report artifact publication failure
        if: ${{ (failure() || cancelled()) && (steps.publish.outcome == 'failure' || steps.publish.outcome == 'cancelled') }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" publish_artifacts FAIL
          --detail "DVC / MinIO publication failed or remote verification was not clean"

      - name: Register MLflow candidate alias
        id: registry
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" register_candidate RUNNING --detail "Registering validated MLflow candidate"
          conda run --no-capture-output -n reid python -m src.register_retraining_candidate \
            --manifest "${V2_PIPELINE_ROOT}/release/model_manifest.json" \
            --validation-report "${V2_PIPELINE_ROOT}/release/validation_report.json" \
            --dvc-publication "${V2_PIPELINE_ROOT}/release/dvc_publication.json" \
            --mlflow-run "${V2_PIPELINE_ROOT}/checkpoint/mlflow_run.json" \
            --alias candidate \
            --output "${V2_ROOT}/release/registration_result.json"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" register_candidate PASS --progress 1 --detail "MLflow candidate alias assigned" --metrics-file "${V2_ROOT}/release/registration_result.json"

      - name: Report registry failure
        if: ${{ (failure() || cancelled()) && (steps.registry.outcome == 'failure' || steps.registry.outcome == 'cancelled') }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" register_candidate FAIL
          --detail "Validated artifacts were not registered with the MLflow candidate alias"

      - name: Upload training reports
        uses: actions/upload-artifact@v4
        with:
          # Keep the legacy prefix so existing artifact consumers remain compatible.
          name: duke-v2-retraining-reports-${{ inputs.cycle_id }}
          path: |
            evidence/evidence_manifest.json
            evidence/approved_decision.json
            ${{ env.V2_ROOT }}/logs/*.json
            ${{ env.V2_ROOT }}/metrics/*.json
            ${{ env.V2_ROOT }}/evaluations/**/metrics/*.json
            ${{ env.V2_ROOT }}/release/*.json
            ${{ env.V2_ROOT }}/checkpoints/*.dvc
            ${{ env.V2_PIPELINE_ROOT }}/onnx/exports/onnx_export_manifest.json
            ${{ env.V2_PIPELINE_ROOT }}/parity/metrics/onnx_parity.json
            ${{ env.V2_PIPELINE_ROOT }}/reference/embeddings/reference_manifest.json
            ${{ env.V2_PIPELINE_ROOT }}/release/*.json
            configs/model_validation_v2.yaml
            dvc.lock
          if-no-files-found: error
          retention-days: 30

      - name: Report setup or preflight failure
        if: ${{ (failure() || cancelled()) && inputs.resume_training_run_id == '' && steps.train.outcome == 'skipped' }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" train_v2 FAIL
          --detail "Retraining setup, lineage materialization or preflight failed before training started"

      - name: Report post-training recovery failure
        if: ${{ (failure() || cancelled()) && inputs.resume_training_run_id != '' && (steps.restore.outcome == 'failure' || steps.restore.outcome == 'cancelled') }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v2 FAIL
          --detail "Could not restore the completed MLflow training run; GPU training was not restarted"

      - name: Report post-training evidence verification failure
        if: ${{ (failure() || cancelled()) && inputs.resume_training_run_id != '' && (steps.evidence_lineage.outcome == 'failure' || steps.evidence_lineage.outcome == 'cancelled') }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v2 FAIL
          --detail "Immutable evidence, dataset revision, or base checkpoint verification failed before MLflow restore; GPU training was not restarted"

      - name: Remove temporary credential file
        if: ${{ always() }}
        run: rm -f .env.mlops
