name: Retrain DukeMTMC-reID model v2

on:
  workflow_dispatch:
    inputs:
      cycle_id:
        description: Control Center cycle ID
        required: true
      source_release:
        description: Source model release
        required: true
      target_release:
        description: Target model release
        required: true
      dataset:
        description: Target dataset
        required: true
      evidence_run_id:
        description: GitHub run that produced immutable pre-approval evidence
        required: true
      evidence_artifact:
        description: Exact pre-approval artifact name
        required: true
      drift_report:
        description: Drift report path inside the downloaded artifact
        required: true
      evaluation_report:
        description: Evaluation report path inside the downloaded artifact
        required: true
      decision:
        description: Destination path for the approved Control API decision
        required: true
      decision_sha256:
        description: Canonical SHA256 of the approved decision
        required: true
      inbox_batch_id:
        description: Data Inbox batch record
        required: false
        default: ""
      dataset_revision:
        description: Immutable batch fingerprint
        required: false
        default: ""
      dataset_path:
        description: Batch path relative to CONTROL_HOST_DATASET_ROOT
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: retrain-duke-v2
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: [self-hosted, linux]
    timeout-minutes: 1440
    env:
      CONTROL_CYCLE_ID: ${{ inputs.cycle_id }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL || 'http://localhost:8090' }}
      CONTROL_CALLBACK_TOKEN: ${{ secrets.CONTROL_CALLBACK_TOKEN }}
      V2_ROOT: artifacts/duke/market1501-duke-vit-bnneck-v2
      BASE_CHECKPOINT: artifacts/market1501/market1501-vit-bnneck-v1/checkpoints/best_model.pth
      DUKE_V2_REPORT: artifacts/duke/market1501-duke-vit-bnneck-v2/evaluations/duke/metrics/evaluation_duke.json
      MARKET1501_V2_REPORT: artifacts/duke/market1501-duke-vit-bnneck-v2/evaluations/market1501/metrics/evaluation_market1501.json
      FORGETTING_REPORT: artifacts/duke/market1501-duke-vit-bnneck-v2/release/catastrophic_forgetting_report.json
      V2_PIPELINE_ROOT: artifacts/pipeline/market1501-duke-vit-bnneck-v2
      # Reduce CUDA allocator fragmentation on the long-lived self-hosted runner.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,max_split_size_mb:128
      INBOX_CONFIG: configs/runtime/duke_v2_inbox_${{ inputs.cycle_id }}.yaml
      INBOX_DATASET_ROOT: ${{ runner.temp }}/reid-inbox-${{ inputs.cycle_id }}/dataset
      INBOX_DATASET_POINTER: ${{ runner.temp }}/reid-inbox-${{ inputs.cycle_id }}/inbox_dataset.dvc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure local MLOps credentials
        env:
          MLOPS_ENV_FILE: ${{ secrets.MLOPS_ENV_FILE }}
        run: |
          test -n "$MLOPS_ENV_FILE"
          printf '%s\n' "$MLOPS_ENV_FILE" > .env.mlops
          chmod 600 .env.mlops

      - name: Download exact pre-approval evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.evidence_artifact }}
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: evidence

      - name: Materialize versioned dataset and base checkpoint
        run: |
          ./scripts/dvc_local.sh pull datasets/dukemtmc-reid.dvc
          ./scripts/dvc_local.sh pull artifacts/market1501/market1501-vit-bnneck-v1/checkpoints/best_model.pth.dvc

      - name: Build immutable Data Inbox training view
        if: ${{ inputs.dataset_path != '' }}
        run: |
          set -a
          source .env.mlops
          set +a
          test -n "${CONTROL_HOST_DATASET_ROOT:-}"
          conda run --no-capture-output -n reid python -m src.prepare_inbox_dataset \
            --source "${CONTROL_HOST_DATASET_ROOT%/}/${{ inputs.dataset_path }}" \
            --base-dataset datasets/dukemtmc-reid \
            --base-config configs/duke_v2_train.yaml \
            --output-root "${INBOX_DATASET_ROOT}" \
            --output-config "${INBOX_CONFIG}" \
            --output-pointer "${INBOX_DATASET_POINTER}" \
            --revision "${{ inputs.dataset_revision }}"

      - name: Verify Git, DVC, dataset and checkpoint lineage
        run: >-
          python -m src.retraining_evidence verify
          --manifest evidence/evidence_manifest.json
          --cycle-id "${{ inputs.cycle_id }}"
          --release-id "${{ inputs.source_release }}"
          --dataset "${{ inputs.dataset }}"
          --current-commit "${{ github.sha }}"
          --dataset-pointer "${{ inputs.dataset_path != '' && env.INBOX_DATASET_POINTER || 'datasets/dukemtmc-reid.dvc' }}"
          --base-checkpoint "${BASE_CHECKPOINT}"

      - name: Fetch and verify approved decision from Control API
        run: |
          curl --fail --silent --show-error \
            -H "X-Control-Callback-Token: ${CONTROL_CALLBACK_TOKEN}" \
            "${CONTROL_API_URL}/control/cycles/${{ inputs.cycle_id }}/retraining-decision" \
            --output "${{ inputs.decision }}"
          python -m src.verify_approved_decision \
            --decision "${{ inputs.decision }}" \
            --evidence-manifest evidence/evidence_manifest.json \
            --decision-sha256 "${{ inputs.decision_sha256 }}" \
            --cycle-id "${{ inputs.cycle_id }}" \
            --source-release "${{ inputs.source_release }}" \
            --dataset "${{ inputs.dataset }}" \
            --target-epochs 50

      - name: Preflight model v2 training
        env:
          DECISION_PATH: evidence/approved_decision.json
          CONFIG_PATH: ${{ inputs.dataset_path != '' && env.INBOX_CONFIG || 'configs/duke_v2_train.yaml' }}
          DATASET_PATH: ${{ inputs.dataset_path != '' && env.INBOX_DATASET_ROOT || 'datasets/dukemtmc-reid' }}
          DATASET_DVC_PATH: ${{ inputs.dataset_path != '' && env.INBOX_DATASET_POINTER || 'datasets/dukemtmc-reid.dvc' }}
        run: ./scripts/train_duke_v2_local.sh --check

      - name: Train model v2
        env:
          DECISION_PATH: evidence/approved_decision.json
          CONFIG_PATH: ${{ inputs.dataset_path != '' && env.INBOX_CONFIG || 'configs/duke_v2_train.yaml' }}
          DATASET_PATH: ${{ inputs.dataset_path != '' && env.INBOX_DATASET_ROOT || 'datasets/dukemtmc-reid' }}
          DATASET_DVC_PATH: ${{ inputs.dataset_path != '' && env.INBOX_DATASET_POINTER || 'datasets/dukemtmc-reid.dvc' }}
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" train_v2 RUNNING --detail "Approved retraining started"
          ./scripts/train_duke_v2_local.sh

      - name: Report training failure
        if: ${{ failure() || cancelled() }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" train_v2 FAIL
          --detail "Model v2 training failed or was cancelled; inspect runner RAM and MLflow logs"

      - name: Mark training complete
        run: |
          conda run --no-capture-output -n reid python -m src.validate_v2_training_completion \
            --run-root "${V2_ROOT}" \
            --output "${V2_ROOT}/logs/training_completion_report.json"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" train_v2 PASS \
            --progress 1 --detail "Model v2 training completed and artifact gate passed" \
            --metrics-file "${V2_ROOT}/logs/training_completion_report.json"

      - name: Evaluate model v2 on DukeMTMC-reID and Market-1501
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v2 RUNNING --detail "Evaluating the same v2 checkpoint on DukeMTMC-reID and Market-1501"
          ./scripts/evaluate_v2_dual_domain.sh

      - name: Check improvement and catastrophic forgetting
        run: |
          set +e
          conda run --no-capture-output -n reid python -m src.catastrophic_forgetting_gate \
            --duke-v1 "${{ inputs.evaluation_report }}" \
            --duke-v2 "${DUKE_V2_REPORT}" \
            --market1501-v1-manifest model_releases/market1501-vit-bnneck/v1/model_manifest.json \
            --market1501-v2 "${MARKET1501_V2_REPORT}" \
            --policy configs/catastrophic_forgetting.yaml \
            --mlflow-run "${V2_ROOT}/logs/mlflow_run.json" \
            --output "${FORGETTING_REPORT}"
          gate_status=$?
          set -e
          conda run --no-capture-output -n reid python -m src.log_v2_evaluations_mlflow \
            --duke "${DUKE_V2_REPORT}" \
            --market1501 "${MARKET1501_V2_REPORT}" \
            --gate "${FORGETTING_REPORT}" \
            --policy configs/catastrophic_forgetting.yaml \
            --mlflow-run "${V2_ROOT}/logs/mlflow_run.json" \
            --output "${V2_ROOT}/logs/evaluation_mlflow.json"
          if [[ "${gate_status}" -ne 0 ]]; then
            python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v2 FAIL \
              --detail "Catastrophic-forgetting gate failed; reports are preserved in MLflow" \
              --metrics-file "${FORGETTING_REPORT}" \
              --metrics-file "duke=${DUKE_V2_REPORT}" \
              --metrics-file "market1501=${MARKET1501_V2_REPORT}"
            exit "${gate_status}"
          fi
          python scripts/control_callback.py "${{ inputs.cycle_id }}" evaluate_v2 PASS \
            --progress 1 --detail "Cross-domain improvement and retention gates passed" \
            --metrics-file "${FORGETTING_REPORT}" \
            --metrics-file "duke=${DUKE_V2_REPORT}" \
            --metrics-file "market1501=${MARKET1501_V2_REPORT}"

      - name: Run retraining lineage gate
        run: |
          python -m src.retraining_validation_gate \
            --evidence evidence/evidence_manifest.json \
            --decision evidence/approved_decision.json \
            --training-metrics "${V2_ROOT}/metrics/metrics_v2.json" \
            --evaluation-metrics "${DUKE_V2_REPORT}" \
            --baseline-evaluation "${{ inputs.evaluation_report }}" \
            --mlflow-run "${V2_ROOT}/logs/mlflow_run.json" \
            --config "${{ inputs.dataset_path != '' && env.INBOX_CONFIG || 'configs/duke_v2_train.yaml' }}" \
            --policy configs/retraining_validation.yaml \
            --base-checkpoint "${BASE_CHECKPOINT}" \
            --candidate-checkpoint "${V2_ROOT}/checkpoints/best_model.pth" \
            --git-commit "${{ github.sha }}" \
            --output "${V2_ROOT}/release/validation_report.json" \
            --manifest-output "${V2_ROOT}/release/model_manifest.json"

      - name: Export, verify and validate model v2 release
        run: |
          mkdir -p artifacts/cross-domain/market1501-v1-on-duke/metrics
          cp "${{ inputs.evaluation_report }}" \
            artifacts/cross-domain/market1501-v1-on-duke/metrics/v1_on_duke.json
          python scripts/control_callback.py "${{ inputs.cycle_id }}" export_onnx RUNNING \
            --detail "Exporting ONNX external weights, checking parity and extracting reference embeddings"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" validate_release RUNNING \
            --detail "Running immutable v2 quality, contract, lineage and checksum policy"
          ./scripts/dvc_local.sh repro v2_package_triton
          python scripts/control_callback.py "${{ inputs.cycle_id }}" export_onnx PASS \
            --progress 1 --detail "ONNX export, parity and reference extraction passed" \
            --metrics-file "${V2_PIPELINE_ROOT}/parity/metrics/onnx_parity.json"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" validate_release PASS \
            --progress 1 --detail "Full v2 release validation gate PASS" \
            --metrics-file "${V2_PIPELINE_ROOT}/release/validation_report.json"

      - name: Persist large candidate artifacts with DVC
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" publish_artifacts RUNNING \
            --detail "Publishing the complete v2 release graph to DVC / MinIO"
          ./scripts/publish_v2_artifacts.sh
          python scripts/control_callback.py "${{ inputs.cycle_id }}" publish_artifacts PASS \
            --progress 1 --detail "DVC remote is clean and publication evidence is versioned" \
            --metrics-file "${V2_PIPELINE_ROOT}/release/dvc_publication.json"

      - name: Register MLflow candidate alias
        run: |
          python scripts/control_callback.py "${{ inputs.cycle_id }}" register_candidate RUNNING --detail "Registering validated MLflow candidate"
          conda run --no-capture-output -n reid python -m src.register_retraining_candidate \
            --manifest "${V2_PIPELINE_ROOT}/release/model_manifest.json" \
            --validation-report "${V2_PIPELINE_ROOT}/release/validation_report.json" \
            --dvc-publication "${V2_PIPELINE_ROOT}/release/dvc_publication.json" \
            --mlflow-run "${V2_PIPELINE_ROOT}/checkpoint/mlflow_run.json" \
            --alias candidate \
            --output "${V2_ROOT}/release/registration_result.json"
          python scripts/control_callback.py "${{ inputs.cycle_id }}" register_candidate PASS --progress 1 --detail "MLflow candidate alias assigned" --metrics-file "${V2_ROOT}/release/registration_result.json"

      - name: Upload training reports
        uses: actions/upload-artifact@v4
        with:
          name: duke-v2-retraining-reports-${{ inputs.cycle_id }}
          path: |
            evidence/evidence_manifest.json
            evidence/approved_decision.json
            artifacts/duke/market1501-duke-vit-bnneck-v2/logs/*.json
            artifacts/duke/market1501-duke-vit-bnneck-v2/metrics/*.json
            artifacts/duke/market1501-duke-vit-bnneck-v2/evaluations/**/metrics/*.json
            artifacts/duke/market1501-duke-vit-bnneck-v2/release/*.json
            artifacts/duke/market1501-duke-vit-bnneck-v2/checkpoints/*.dvc
            artifacts/pipeline/market1501-duke-vit-bnneck-v2/onnx/exports/onnx_export_manifest.json
            artifacts/pipeline/market1501-duke-vit-bnneck-v2/parity/metrics/onnx_parity.json
            artifacts/pipeline/market1501-duke-vit-bnneck-v2/reference/embeddings/reference_manifest.json
            artifacts/pipeline/market1501-duke-vit-bnneck-v2/release/*.json
            dvc.lock
          if-no-files-found: error
          retention-days: 30

      - name: Report workflow failure
        if: ${{ failure() || cancelled() }}
        run: >-
          python scripts/control_callback.py "${{ inputs.cycle_id }}" validate_release FAIL
          --detail "Retraining workflow failed; inspect GitHub Actions and MLflow logs"

      - name: Remove temporary credential file
        if: ${{ always() }}
        run: rm -f .env.mlops
