stages:
  validate_data:
    cmd: >-
      conda run --no-capture-output -n ${pipeline.conda_env}
      python src/validate_data.py
      --config configs/vit_reid.yaml
      --dataset-pointer ${pipeline.dataset_pointer}
      --output artifacts/pipeline/${pipeline.release_slug}/validate/data_manifest.json
    deps:
      - src/validate_data.py
      - src/common/config.py
      - src/common/utils.py
      - ${pipeline.dataset_root}
    params:
      - pipeline.release_slug
      - pipeline.conda_env
      - pipeline.dataset_root
      - pipeline.dataset_pointer
      - configs/vit_reid.yaml:
          - data
    outs:
      - artifacts/pipeline/${pipeline.release_slug}/validate/data_manifest.json

  train:
    cmd: >-
      conda run --no-capture-output -n ${pipeline.conda_env}
      python src/train.py
      --config configs/vit_reid.yaml
      --set data.location.root=${pipeline.dataset_root}
      --set train.epochs=${train.epochs}
      --set evaluation.flip_test=${evaluate.flip_test}
      --set evaluation.use_rerank=${evaluate.use_rerank}
      --set logging.enable_mlflow=${train.enable_mlflow}
      --set runtime.run_slug=${pipeline.release_slug}-train
      --set artifacts.run_root=artifacts/pipeline/${pipeline.release_slug}/train
    deps:
      - src/train.py
      - src/common/config.py
      - src/common/utils.py
      - src/common/mlflow_utils.py
      - src/data
      - src/models
      - src/reid
      - artifacts/pipeline/${pipeline.release_slug}/validate/data_manifest.json
      - ${pipeline.dataset_root}
    params:
      - pipeline.release_slug
      - pipeline.conda_env
      - pipeline.dataset_root
      - train.epochs
      - train.enable_mlflow
      - evaluate.flip_test
      - evaluate.use_rerank
      - configs/vit_reid.yaml:
          - seed
          - device
          - num_workers
          - data
          - model
          - train
          - augmentation
          - evaluation
          - logging.tracking_uri
    outs:
      - artifacts/pipeline/${pipeline.release_slug}/train/checkpoints/best_model.pth
      - artifacts/pipeline/${pipeline.release_slug}/train/logs/effective_config.json
      - artifacts/pipeline/${pipeline.release_slug}/train/logs/mlflow_run.json
    metrics:
      - artifacts/pipeline/${pipeline.release_slug}/train/metrics/metrics_v1.json:
          cache: true

  evaluate:
    cmd: >-
      conda run --no-capture-output -n ${pipeline.conda_env}
      python src/evaluate.py
      --config configs/vit_reid.yaml
      --checkpoint artifacts/pipeline/${pipeline.release_slug}/train/checkpoints/best_model.pth
      --set data.location.root=${pipeline.dataset_root}
      --set evaluation.flip_test=${evaluate.flip_test}
      --set evaluation.use_rerank=${evaluate.use_rerank}
      --set runtime.run_slug=${pipeline.release_slug}-evaluate
      --set artifacts.run_root=artifacts/pipeline/${pipeline.release_slug}/evaluate
    deps:
      - src/evaluate.py
      - src/common/config.py
      - src/common/utils.py
      - src/data
      - src/models
      - src/reid/evaluation.py
      - artifacts/pipeline/${pipeline.release_slug}/train/checkpoints/best_model.pth
      - ${pipeline.dataset_root}
    params:
      - pipeline.release_slug
      - pipeline.conda_env
      - pipeline.dataset_root
      - evaluate.flip_test
      - evaluate.use_rerank
      - configs/vit_reid.yaml:
          - device
          - num_workers
          - data
          - model
          - evaluation
    metrics:
      - artifacts/pipeline/${pipeline.release_slug}/evaluate/metrics/evaluation_latest.json:
          cache: true

  export_onnx:
    cmd: >-
      conda run --no-capture-output -n ${pipeline.conda_env}
      python src/export_onnx.py
      --config configs/vit_reid.yaml
      --checkpoint artifacts/pipeline/${pipeline.release_slug}/train/checkpoints/best_model.pth
      --opset ${export.opset}
      --set data.location.root=${pipeline.dataset_root}
      --set runtime.run_slug=${pipeline.release_slug}-onnx
      --set artifacts.run_root=artifacts/pipeline/${pipeline.release_slug}/onnx
    deps:
      - src/export_onnx.py
      - src/common/config.py
      - src/common/utils.py
      - src/models
      - artifacts/pipeline/${pipeline.release_slug}/train/checkpoints/best_model.pth
    params:
      - pipeline.release_slug
      - pipeline.conda_env
      - pipeline.dataset_root
      - export.opset
      - configs/vit_reid.yaml:
          - device
          - data.image_height
          - data.image_width
          - data.preserve_aspect_ratio
          - model
    outs:
      - artifacts/pipeline/${pipeline.release_slug}/onnx/exports/model_embedding.onnx
      - artifacts/pipeline/${pipeline.release_slug}/onnx/exports/model_embedding.onnx.data
      - artifacts/pipeline/${pipeline.release_slug}/onnx/exports/onnx_export_manifest.json

  verify_onnx:
    cmd: >-
      conda run --no-capture-output -n ${pipeline.conda_env}
      python src/verify_onnx.py
      --config configs/vit_reid.yaml
      --checkpoint artifacts/pipeline/${pipeline.release_slug}/train/checkpoints/best_model.pth
      --onnx-path artifacts/pipeline/${pipeline.release_slug}/onnx/exports/model_embedding.onnx
      --split ${parity.split}
      --num-samples ${parity.num_samples}
      --atol ${parity.atol}
      --rtol ${parity.rtol}
      --set data.location.root=${pipeline.dataset_root}
      --set runtime.run_slug=${pipeline.release_slug}-parity
      --set artifacts.run_root=artifacts/pipeline/${pipeline.release_slug}/parity
    deps:
      - src/verify_onnx.py
      - src/common/config.py
      - src/common/utils.py
      - src/data
      - src/models
      - artifacts/pipeline/${pipeline.release_slug}/train/checkpoints/best_model.pth
      - artifacts/pipeline/${pipeline.release_slug}/onnx/exports/model_embedding.onnx
      - artifacts/pipeline/${pipeline.release_slug}/onnx/exports/model_embedding.onnx.data
      - ${pipeline.dataset_root}
    params:
      - pipeline.release_slug
      - pipeline.conda_env
      - pipeline.dataset_root
      - parity
      - configs/vit_reid.yaml:
          - device
          - data
          - model
    metrics:
      - artifacts/pipeline/${pipeline.release_slug}/parity/metrics/onnx_parity.json:
          cache: true

  extract_reference:
    cmd: >-
      conda run --no-capture-output -n ${pipeline.conda_env}
      python src/extract_reference.py
      --config configs/vit_reid.yaml
      --checkpoint artifacts/pipeline/${pipeline.release_slug}/train/checkpoints/best_model.pth
      --set data.location.root=${pipeline.dataset_root}
      --set runtime.run_slug=${pipeline.release_slug}-reference
      --set artifacts.run_root=artifacts/pipeline/${pipeline.release_slug}/reference
    deps:
      - src/extract_reference.py
      - src/common/config.py
      - src/common/utils.py
      - src/data
      - src/models
      - src/reid/evaluation.py
      - artifacts/pipeline/${pipeline.release_slug}/train/checkpoints/best_model.pth
      - ${pipeline.dataset_root}
    params:
      - pipeline.release_slug
      - pipeline.conda_env
      - pipeline.dataset_root
      - configs/vit_reid.yaml:
          - device
          - num_workers
          - data
          - model
    outs:
      - artifacts/pipeline/${pipeline.release_slug}/reference/embeddings/reference_embeddings.npy
      - artifacts/pipeline/${pipeline.release_slug}/reference/embeddings/reference_pids.npy
      - artifacts/pipeline/${pipeline.release_slug}/reference/embeddings/reference_camids.npy
      - artifacts/pipeline/${pipeline.release_slug}/reference/embeddings/reference_paths.npy
      - artifacts/pipeline/${pipeline.release_slug}/reference/embeddings/reference_manifest.json

  package_triton:
    cmd: >-
      conda run --no-capture-output -n ${pipeline.conda_env}
      python src/prepare_triton_model.py
      --onnx-path artifacts/pipeline/${pipeline.release_slug}/onnx/exports/model_embedding.onnx
      --output-root artifacts/pipeline/${pipeline.release_slug}/triton/model_repository
      --model-name ${triton.model_name}
      --model-version ${triton.model_version}
      --max-batch-size ${triton.max_batch_size}
      --input-height 224
      --input-width 224
      --embedding-dim 512
      --preferred-batch-sizes ${triton.preferred_batch_sizes}
      --instance-kind ${triton.instance_kind}
      --validation-report artifacts/pipeline/${pipeline.release_slug}/release/validation_report.json
    deps:
      - src/prepare_triton_model.py
      - src/common/utils.py
      - artifacts/pipeline/${pipeline.release_slug}/onnx/exports/model_embedding.onnx
      - artifacts/pipeline/${pipeline.release_slug}/onnx/exports/model_embedding.onnx.data
      - artifacts/pipeline/${pipeline.release_slug}/release/validation_report.json
    params:
      - pipeline.release_slug
      - pipeline.conda_env
      - triton
    outs:
      - artifacts/pipeline/${pipeline.release_slug}/triton/model_repository

  validate_release:
    cmd: >-
      conda run --no-capture-output -n ${pipeline.conda_env}
      python src/model_validation_gate.py
      --release-id ${pipeline.release_id}
      --source-git-commit ${pipeline.source_git_commit}
      --thresholds ${validation.thresholds}
      --config configs/vit_reid.yaml
      --pipeline-params params.yaml
      --data-manifest artifacts/pipeline/${pipeline.release_slug}/validate/data_manifest.json
      --training-metrics artifacts/pipeline/${pipeline.release_slug}/train/metrics/metrics_v1.json
      --evaluation-metrics artifacts/pipeline/${pipeline.release_slug}/evaluate/metrics/evaluation_latest.json
      --onnx-manifest artifacts/pipeline/${pipeline.release_slug}/onnx/exports/onnx_export_manifest.json
      --parity-report artifacts/pipeline/${pipeline.release_slug}/parity/metrics/onnx_parity.json
      --reference-manifest artifacts/pipeline/${pipeline.release_slug}/reference/embeddings/reference_manifest.json
      --checkpoint artifacts/pipeline/${pipeline.release_slug}/train/checkpoints/best_model.pth
      --onnx artifacts/pipeline/${pipeline.release_slug}/onnx/exports/model_embedding.onnx
      --preprocessing ${pipeline.preprocessing_contract}
      --preprocessing-output artifacts/pipeline/${pipeline.release_slug}/release/preprocessing.json
      --deployment-metrics ${validation.deployment_metrics}
      --mlflow-run-metadata artifacts/pipeline/${pipeline.release_slug}/train/logs/mlflow_run.json
      --output artifacts/pipeline/${pipeline.release_slug}/release/validation_report.json
      --manifest-output artifacts/pipeline/${pipeline.release_slug}/release/model_manifest.json
    deps:
      - src/model_validation_gate.py
      - src/common/utils.py
      - configs/vit_reid.yaml
      - params.yaml
      - ${validation.thresholds}
      - ${validation.deployment_metrics}
      - artifacts/pipeline/${pipeline.release_slug}/validate/data_manifest.json
      - artifacts/pipeline/${pipeline.release_slug}/train/metrics/metrics_v1.json
      - artifacts/pipeline/${pipeline.release_slug}/train/logs/mlflow_run.json
      - artifacts/pipeline/${pipeline.release_slug}/evaluate/metrics/evaluation_latest.json
      - artifacts/pipeline/${pipeline.release_slug}/train/checkpoints/best_model.pth
      - artifacts/pipeline/${pipeline.release_slug}/onnx/exports/model_embedding.onnx
      - artifacts/pipeline/${pipeline.release_slug}/onnx/exports/model_embedding.onnx.data
      - artifacts/pipeline/${pipeline.release_slug}/onnx/exports/onnx_export_manifest.json
      - artifacts/pipeline/${pipeline.release_slug}/parity/metrics/onnx_parity.json
      - artifacts/pipeline/${pipeline.release_slug}/reference/embeddings/reference_manifest.json
      - artifacts/pipeline/${pipeline.release_slug}/reference/embeddings/reference_embeddings.npy
      - artifacts/pipeline/${pipeline.release_slug}/reference/embeddings/reference_pids.npy
      - artifacts/pipeline/${pipeline.release_slug}/reference/embeddings/reference_camids.npy
      - artifacts/pipeline/${pipeline.release_slug}/reference/embeddings/reference_paths.npy
      - ${pipeline.preprocessing_contract}
    params:
      - pipeline.release_slug
      - pipeline.release_id
      - pipeline.source_git_commit
      - pipeline.conda_env
      - pipeline.preprocessing_contract
      - validation
    outs:
      - artifacts/pipeline/${pipeline.release_slug}/release/model_manifest.json
      - artifacts/pipeline/${pipeline.release_slug}/release/preprocessing.json
    metrics:
      - artifacts/pipeline/${pipeline.release_slug}/release/validation_report.json:
          cache: true

  v2_validate_data:
    cmd: >-
      conda run --no-capture-output -n ${v2_pipeline.conda_env}
      python -m src.validate_v2_release_data
      --duke-config configs/duke_v2_eval.yaml
      --duke-pointer ${v2_pipeline.duke_pointer}
      --market1501-config configs/market1501_v2_eval.yaml
      --market1501-pointer ${v2_pipeline.market1501_pointer}
      --output artifacts/pipeline/${v2_pipeline.release_slug}/validate/data_manifest.json
    deps:
      - src/validate_v2_release_data.py
      - src/validate_data.py
      - src/common/config.py
      - configs/duke_v2_eval.yaml
      - configs/market1501_v2_eval.yaml
      - ${v2_pipeline.duke_root}
      - ${v2_pipeline.market1501_root}
    params:
      - v2_pipeline.release_slug
      - v2_pipeline.conda_env
      - v2_pipeline.duke_root
      - v2_pipeline.market1501_root
      - v2_pipeline.duke_pointer
      - v2_pipeline.market1501_pointer
    outs:
      - artifacts/pipeline/${v2_pipeline.release_slug}/validate/data_manifest.json

  v2_checkpoint:
    cmd: >-
      conda run --no-capture-output -n ${v2_pipeline.conda_env}
      python -m src.import_v2_checkpoint
      --checkpoint ${v2_pipeline.source_root}/checkpoints/best_model.pth
      --training-metrics ${v2_pipeline.source_root}/metrics/metrics_v2.json
      --mlflow-run ${v2_pipeline.source_root}/logs/mlflow_run.json
      --transfer-report ${v2_pipeline.source_root}/logs/transfer_report.json
      --effective-config ${v2_pipeline.source_root}/logs/effective_config.json
      --data-manifest artifacts/pipeline/${v2_pipeline.release_slug}/validate/data_manifest.json
      --output-root artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint
    deps:
      - src/import_v2_checkpoint.py
      - artifacts/pipeline/${v2_pipeline.release_slug}/validate/data_manifest.json
      - ${v2_pipeline.source_root}/checkpoints/best_model.pth
      - ${v2_pipeline.source_root}/metrics/metrics_v2.json
      - ${v2_pipeline.source_root}/logs/mlflow_run.json
      - ${v2_pipeline.source_root}/logs/transfer_report.json
      - ${v2_pipeline.source_root}/logs/effective_config.json
    params:
      - v2_pipeline.release_slug
      - v2_pipeline.source_root
      - v2_pipeline.conda_env
    outs:
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/checkpoint_manifest.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/metrics_v2.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/mlflow_run.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/transfer_report.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/effective_config.json

  v2_evaluate_duke:
    cmd: >-
      conda run --no-capture-output -n ${v2_pipeline.conda_env}
      python -m src.evaluate --config configs/duke_v2_eval.yaml
      --checkpoint artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
      --set artifacts.run_root=artifacts/pipeline/${v2_pipeline.release_slug}/evaluate_duke
    deps:
      - src/evaluate.py
      - src/data
      - src/models
      - src/reid/evaluation.py
      - configs/duke_v2_eval.yaml
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
      - ${v2_pipeline.duke_root}
    params:
      - v2_pipeline.release_slug
      - v2_pipeline.conda_env
      - v2_pipeline.duke_root
      - configs/duke_v2_eval.yaml:
          - data
          - model
          - evaluation
    metrics:
      - artifacts/pipeline/${v2_pipeline.release_slug}/evaluate_duke/metrics/evaluation_duke.json:
          cache: true

  v2_evaluate_market1501:
    cmd: >-
      conda run --no-capture-output -n ${v2_pipeline.conda_env}
      python -m src.evaluate --config configs/market1501_v2_eval.yaml
      --checkpoint artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
      --set artifacts.run_root=artifacts/pipeline/${v2_pipeline.release_slug}/evaluate_market1501
    deps:
      - src/evaluate.py
      - src/data
      - src/models
      - src/reid/evaluation.py
      - configs/market1501_v2_eval.yaml
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
      - ${v2_pipeline.market1501_root}
    params:
      - v2_pipeline.release_slug
      - v2_pipeline.conda_env
      - v2_pipeline.market1501_root
      - configs/market1501_v2_eval.yaml:
          - data
          - model
          - evaluation
    metrics:
      - artifacts/pipeline/${v2_pipeline.release_slug}/evaluate_market1501/metrics/evaluation_market1501.json:
          cache: true

  v2_export_onnx:
    cmd: >-
      conda run --no-capture-output -n ${v2_pipeline.conda_env}
      python -m src.export_onnx --config configs/duke_v2_train.yaml
      --checkpoint artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
      --opset ${v2_pipeline.opset}
      --set artifacts.run_root=artifacts/pipeline/${v2_pipeline.release_slug}/onnx
    deps:
      - src/export_onnx.py
      - src/models
      - configs/duke_v2_train.yaml
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
    params:
      - v2_pipeline.release_slug
      - v2_pipeline.conda_env
      - v2_pipeline.opset
      - configs/duke_v2_train.yaml:
          - device
          - data.image_height
          - data.image_width
          - data.preserve_aspect_ratio
          - model
    outs:
      - artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/model_embedding.onnx
      - artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/model_embedding.onnx.data
      - artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/onnx_export_manifest.json

  v2_verify_onnx:
    cmd: >-
      conda run --no-capture-output -n ${v2_pipeline.conda_env}
      python -m src.verify_onnx --config configs/duke_v2_train.yaml
      --checkpoint artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
      --onnx-path artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/model_embedding.onnx
      --split query --num-samples ${v2_pipeline.parity_samples}
      --atol 0.0001 --rtol 0.0001
      --set artifacts.run_root=artifacts/pipeline/${v2_pipeline.release_slug}/parity
    deps:
      - src/verify_onnx.py
      - src/data
      - src/models
      - configs/duke_v2_train.yaml
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
      - artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/model_embedding.onnx
      - artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/model_embedding.onnx.data
      - ${v2_pipeline.duke_root}
    params:
      - v2_pipeline.release_slug
      - v2_pipeline.conda_env
      - v2_pipeline.parity_samples
      - configs/duke_v2_train.yaml:
          - device
          - data
          - model
    metrics:
      - artifacts/pipeline/${v2_pipeline.release_slug}/parity/metrics/onnx_parity.json:
          cache: true

  v2_extract_reference:
    cmd: >-
      conda run --no-capture-output -n ${v2_pipeline.conda_env}
      python -m src.extract_reference --config configs/duke_v2_train.yaml
      --checkpoint artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
      --set artifacts.run_root=artifacts/pipeline/${v2_pipeline.release_slug}/reference
    deps:
      - src/extract_reference.py
      - src/data
      - src/models
      - src/reid/evaluation.py
      - configs/duke_v2_train.yaml
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
      - ${v2_pipeline.duke_root}
    params:
      - v2_pipeline.release_slug
      - v2_pipeline.conda_env
      - configs/duke_v2_train.yaml:
          - device
          - num_workers
          - data
          - model
    outs:
      - artifacts/pipeline/${v2_pipeline.release_slug}/reference/embeddings/reference_embeddings.npy
      - artifacts/pipeline/${v2_pipeline.release_slug}/reference/embeddings/reference_pids.npy
      - artifacts/pipeline/${v2_pipeline.release_slug}/reference/embeddings/reference_camids.npy
      - artifacts/pipeline/${v2_pipeline.release_slug}/reference/embeddings/reference_paths.npy
      - artifacts/pipeline/${v2_pipeline.release_slug}/reference/embeddings/reference_manifest.json

  v2_validate_release:
    cmd: >-
      conda run --no-capture-output -n ${v2_pipeline.conda_env}
      env V2_PIPELINE_ROOT=artifacts/pipeline/${v2_pipeline.release_slug}
      bash scripts/validate_v2_dvc_release.sh
    deps:
      - scripts/validate_v2_dvc_release.sh
      - src/catastrophic_forgetting_gate.py
      - src/validate_v2_dvc_release.py
      - configs/catastrophic_forgetting.yaml
      - configs/model_validation_v2.yaml
      - model_releases/market1501-vit-bnneck/v1/model_manifest.json
      - artifacts/cross-domain/market1501-v1-on-duke/metrics/v1_on_duke.json
      - ${v2_pipeline.preprocessing_contract}
      - artifacts/pipeline/${v2_pipeline.release_slug}/validate/data_manifest.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/best_model.pth
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/checkpoint_manifest.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/checkpoint/mlflow_run.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/evaluate_duke/metrics/evaluation_duke.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/evaluate_market1501/metrics/evaluation_market1501.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/model_embedding.onnx
      - artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/model_embedding.onnx.data
      - artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/onnx_export_manifest.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/parity/metrics/onnx_parity.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/reference/embeddings/reference_manifest.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/reference/embeddings/reference_embeddings.npy
      - artifacts/pipeline/${v2_pipeline.release_slug}/reference/embeddings/reference_pids.npy
      - artifacts/pipeline/${v2_pipeline.release_slug}/reference/embeddings/reference_camids.npy
      - artifacts/pipeline/${v2_pipeline.release_slug}/reference/embeddings/reference_paths.npy
    params:
      - v2_pipeline.release_slug
      - v2_pipeline.release_id
      - v2_pipeline.conda_env
      - v2_pipeline.preprocessing_contract
      - v2_pipeline.validation_policy
      - configs/catastrophic_forgetting.yaml:
          - duke_improvement
          - market1501_retention
    outs:
      - artifacts/pipeline/${v2_pipeline.release_slug}/release/model_manifest.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/release/preprocessing.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/release/catastrophic_forgetting_report.json
    metrics:
      - artifacts/pipeline/${v2_pipeline.release_slug}/release/validation_report.json:
          cache: true

  v2_package_triton:
    cmd: >-
      conda run --no-capture-output -n ${v2_pipeline.conda_env}
      python -m src.prepare_triton_model
      --onnx-path artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/model_embedding.onnx
      --output-root artifacts/pipeline/${v2_pipeline.release_slug}/triton/model_repository
      --model-name reid_embedding --model-version ${v2_pipeline.model_version}
      --max-batch-size 0 --input-height 224 --input-width 224 --embedding-dim 512
      --preferred-batch-sizes 4,8,16 --instance-kind KIND_GPU
      --validation-report artifacts/pipeline/${v2_pipeline.release_slug}/release/validation_report.json
    deps:
      - src/prepare_triton_model.py
      - artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/model_embedding.onnx
      - artifacts/pipeline/${v2_pipeline.release_slug}/onnx/exports/model_embedding.onnx.data
      - artifacts/pipeline/${v2_pipeline.release_slug}/release/validation_report.json
      - artifacts/pipeline/${v2_pipeline.release_slug}/release/model_manifest.json
    params:
      - v2_pipeline.release_slug
      - v2_pipeline.conda_env
      - v2_pipeline.model_version
    outs:
      - artifacts/pipeline/${v2_pipeline.release_slug}/triton/model_repository
