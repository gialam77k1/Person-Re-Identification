project_name: person-reid-mlops
experiment_name: msmt17-baseline
seed: 42
device: auto
num_workers: 2

data:
  source_type: image_folder
  dataset:
    name: msmt17
  location:
    root: datasets/MSMT17_V1
    list_files:
      train: datasets/MSMT17_V1/list_train.txt
      query: datasets/MSMT17_V1/list_query.txt
      gallery: datasets/MSMT17_V1/list_gallery.txt
  image_height: 256
  image_width: 128
  batch_size: 16
  eval_batch_size: 32
  instances_per_identity: 4

model:
  variant: baseline
  backbone: resnet50
  pretrained: true
  embedding_dim: 512

train:
  epochs: 30
  learning_rate: 0.0003
  backbone_lr_factor: 0.1
  weight_decay: 0.0005
  ce_weight: 1.0
  triplet_weight: 1.0
  triplet_margin: 0.3
  label_smoothing: 0.0
  warmup_epochs: 3
  min_lr_scale: 0.01
  amp: true

augmentation:
  color_jitter: false
  random_erasing: false
  random_grayscale_p: 0.0

evaluation:
  use_rerank: false
  rerank_k1: 20
  rerank_k2: 6
  rerank_lambda: 0.3

logging:
  enable_mlflow: true
  tracking_uri: sqlite:///mlruns/mlflow.db
  artifact_location: artifacts/mlflow

artifacts:
  root: artifacts
  checkpoints_dir: artifacts/checkpoints
  metrics_dir: artifacts/metrics
  embeddings_dir: artifacts/embeddings
  logs_dir: artifacts/logs
