project_name: person-reid-mlops
experiment_name: market1501-dadnet
seed: 42
device: auto
num_workers: 2

data:
  root: datasets/Market-1501-v15.09.15
  train_dir: datasets/Market-1501-v15.09.15/bounding_box_train
  query_dir: datasets/Market-1501-v15.09.15/query
  gallery_dir: datasets/Market-1501-v15.09.15/bounding_box_test
  image_height: 384
  image_width: 128
  batch_size: 12
  eval_batch_size: 16
  instances_per_identity: 4

model:
  variant: dadnet
  backbone: resnet50
  pretrained: true
  embedding_dim: 512
  attention_reduction: 8
  dem_dropout: 0.0

train:
  epochs: 50
  learning_rate: 0.00025
  backbone_lr_factor: 0.1
  weight_decay: 0.0005
  ce_weight: 1.0
  triplet_weight: 1.0
  triplet_margin: 0.35
  label_smoothing: 0.05
  scheduler_type: plateau
  lr_reduce_factor: 0.5
  lr_reduce_patience: 5
  lr_reduce_threshold: 0.001
  min_lr: 0.000001
  amp: true
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001
    monitor: mAP

augmentation:
  color_jitter: false
  random_erasing: true
  random_grayscale_p: 0.0

evaluation:
  use_rerank: false
  rerank_k1: 20
  rerank_k2: 6
  rerank_lambda: 0.3

logging:
  enable_mlflow: true
  tracking_uri: sqlite:///mlruns/mlflow.db
  artifact_location: artifacts/mlflow

artifacts:
  root: artifacts
  checkpoints_dir: artifacts/checkpoints
  metrics_dir: artifacts/metrics
  embeddings_dir: artifacts/embeddings
  logs_dir: artifacts/logs
