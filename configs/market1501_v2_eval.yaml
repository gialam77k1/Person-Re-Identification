project_name: person-reid-mlops
experiment_name: market1501-msmt17-vit-bnneck-v2
seed: 42
device: auto
num_workers: 2

release:
  id: market1501-msmt17-vit-bnneck:v2
  base_release_id: market1501-vit-bnneck:v1-dvc

data:
  source_type: image_folder
  dataset:
    name: market1501
    version: Market-1501-v15.09.15
  location:
    root: datasets/Market-1501-v15.09.15
    splits:
      train: bounding_box_train
      query: query
      gallery: bounding_box_test
  image_height: 224
  image_width: 224
  preserve_aspect_ratio: true
  batch_size: 16
  eval_batch_size: 32
  instances_per_identity: 4

model:
  variant: vit
  backbone: vit_b_16
  pretrained: false
  embedding_dim: 512
  dropout: 0.1
  use_local_branch: true
  num_local_stripes: 4
  local_branch_dropout: 0.1
  use_bnneck: true
  use_auxiliary_branch_loss: true

evaluation:
  use_rerank: true
  rerank_k1: 20
  rerank_k2: 6
  rerank_lambda: 0.3
  flip_test: true
  dataset_pointer: datasets/Market-1501-v15.09.15.dvc
  report_filename: evaluation_market1501.json

artifacts:
  root: artifacts
  run_root: artifacts/msmt17/market1501-msmt17-vit-bnneck-v2/evaluations/market1501
