project_name: person-reid-mlops
experiment_name: market1501-v1-cross-domain-duke
seed: 42
device: auto
num_workers: 2

data:
  source_type: image_folder
  dataset:
    name: dukemtmc-reid
    version: dukemtmc-reid
  location:
    root: datasets/dukemtmc-reid
    splits:
      train: bounding_box_train
      query: query
      gallery: bounding_box_test
  image_height: 224
  image_width: 224
  preserve_aspect_ratio: true
  batch_size: 16
  eval_batch_size: 32
  instances_per_identity: 4

model:
  variant: vit
  backbone: vit_b_16
  pretrained: true
  embedding_dim: 512
  dropout: 0.1
  use_local_branch: true
  num_local_stripes: 4
  local_branch_dropout: 0.1
  use_bnneck: true
  use_auxiliary_branch_loss: true

evaluation:
  use_rerank: false
  flip_test: false
  protocol: cross_domain_v1_triton

logging:
  enable_mlflow: true
  tracking_uri: http://localhost:5000

artifacts:
  root: artifacts
  run_root: artifacts/cross-domain/market1501-v1-on-duke
