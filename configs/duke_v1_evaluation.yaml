project_name: person-reid-mlops
experiment_name: market1501-v1-cross-domain-msmt17
seed: 42
device: auto
num_workers: 2

data:
  source_type: image_folder
  dataset:
    name: msmt17
    version: MSMT17_V1
  location:
    root: datasets/MSMT17_V1
    splits:
      train: train
      query: test
      gallery: test
    list_files:
      train: datasets/MSMT17_V1/list_train.txt
      query: datasets/MSMT17_V1/list_query.txt
      gallery: datasets/MSMT17_V1/list_gallery.txt
  image_height: 224
  image_width: 224
  preserve_aspect_ratio: true
  batch_size: 16
  eval_batch_size: 32
  instances_per_identity: 4

model:
  variant: vit
  backbone: vit_b_16
  pretrained: true
  embedding_dim: 512
  dropout: 0.1
  use_local_branch: true
  num_local_stripes: 4
  local_branch_dropout: 0.1
  use_bnneck: true
  use_auxiliary_branch_loss: true

evaluation:
  use_rerank: false
  flip_test: false
  protocol: cross_domain_v1_triton

logging:
  enable_mlflow: true
  tracking_uri: http://localhost:5000

artifacts:
  root: artifacts
  run_root: artifacts/cross-domain/market1501-v1-on-msmt17
