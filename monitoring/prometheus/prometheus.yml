global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: person-reid
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: reid-api
    metrics_path: /metrics
    static_configs:
      - targets: ["inference-api:8080"]

  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets: ["triton-server:8002"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: gpu
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
