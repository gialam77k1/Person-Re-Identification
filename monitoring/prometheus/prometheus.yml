global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: person-reid
    environment: local

scrape_configs:
  - job_name: reid-api
    metrics_path: /metrics
    static_configs:
      - targets: ["inference-api:8080"]

  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets: ["triton-server:8002"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

