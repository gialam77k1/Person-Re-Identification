groups:
  - name: reid-system
    rules:
      - alert: ReIDMonitoringTargetDown
        expr: up{job=~"reid-api|triton|qdrant|node|containers|gpu"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring target {{ $labels.job }} is down"
          description: "Prometheus could not scrape {{ $labels.instance }} for more than 2 minutes."

      - alert: ReIDServingComponentUnhealthy
        expr: reid_service_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ReID serving component {{ $labels.component }} is unhealthy"
          description: "The API readiness probe has reported this dependency unavailable for 2 minutes."

      - alert: ReIDAPIHighErrorRate
        expr: |
          sum(rate(reid_api_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(reid_api_requests_total[5m])), 0.000001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ReID API error rate is above 5%"
          description: "The 5xx response ratio has exceeded 5% for 5 minutes."

      - alert: ReIDAPIHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(reid_api_request_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ReID API p95 latency is above 500 ms"
          description: "End-to-end API p95 latency has exceeded the initial SLO for 5 minutes."

      - alert: ReIDUpstreamHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service, operation) (rate(reid_upstream_duration_seconds_bucket[5m]))
          ) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} {{ $labels.operation }} p95 latency is high"
          description: "The upstream operation has exceeded 250 ms for 5 minutes."

      - alert: ReIDQdrantCollectionEmpty
        expr: reid_qdrant_collection_points <= 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ReID Qdrant collection is empty"
          description: "Collection {{ $labels.collection }} has no reference embeddings."

  - name: reid-model
    rules:
      - alert: ReIDHighNoMatchRate
        expr: |
          rate(reid_search_queries_total{outcome="no_match"}[15m])
          /
          clamp_min(sum(rate(reid_search_queries_total[15m])), 0.000001)
          > 0.40
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ReID no-match rate is above 40%"
          description: "No-match behavior may indicate data drift, a threshold issue, or degraded retrieval."

      - alert: ReIDEmbeddingDriftDetected
        expr: reid_embedding_drift_detected == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Embedding drift policy failed"
          description: "The latest periodic report for {{ $labels.release_id }} detected embedding drift."

      - alert: ReIDDriftReportStale
        expr: |
          absent(reid_embedding_drift_last_run_timestamp_seconds)
          or
          (time() - reid_embedding_drift_last_run_timestamp_seconds > 172800)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Embedding drift report is stale"
          description: "No successful drift report has been produced for more than 48 hours."
