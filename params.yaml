pipeline:
  release_slug: market1501-vit-bnneck-v1-dvc
  release_id: market1501-vit-bnneck:v1-dvc
  source_git_commit: 3bc5cd9e68d4b186900ba52e89976e9c94be28cc
  conda_env: reid
  dataset_root: datasets/Market-1501-v15.09.15
  dataset_pointer: datasets/Market-1501-v15.09.15.dvc
  preprocessing_contract: model_releases/market1501-vit-bnneck/v1/preprocessing.json

train:
  epochs: 50
  enable_mlflow: true

evaluate:
  flip_test: true
  use_rerank: true

export:
  opset: 18

parity:
  split: query
  num_samples: 8
  atol: 0.0001
  rtol: 0.0001

validation:
  thresholds: configs/model_validation.yaml
  deployment_metrics: model_releases/market1501-vit-bnneck/v1/deployment_metrics.json

triton:
  model_name: reid_embedding
  model_version: 1
  max_batch_size: 0
  preferred_batch_sizes: 4,8,16
  instance_kind: KIND_GPU

v2_pipeline:
  release_slug: market1501-duke-vit-bnneck-v2
