name: person-reid-mlops

services:
  postgres:
    image: postgres:16.4-bookworm
    container_name: reid-postgres
    restart: unless-stopped
    env_file:
      - .env.mlops
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mlops

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: reid-minio
    restart: unless-stopped
    env_file:
      - .env.mlops
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mlops

  minio-init:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
      args:
        MLFLOW_BASE_IMAGE: ghcr.io/mlflow/mlflow:v3.10.0
    image: person-reid/mlflow:3.10.0
    container_name: reid-minio-init
    restart: "no"
    env_file:
      - .env.mlops
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["python", "/opt/reid/init_minio_buckets.py"]
    networks:
      - mlops

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
      args:
        MLFLOW_BASE_IMAGE: ghcr.io/mlflow/mlflow:v3.10.0
    image: person-reid/mlflow:3.10.0
    container_name: reid-mlflow
    restart: unless-stopped
    env_file:
      - .env.mlops
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    command: ["python", "/opt/reid/start_mlflow_server.py"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - mlops

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: reid-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ${QDRANT_STORAGE_PATH:-./artifacts/qdrant/storage}:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mlops

  triton-server:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    container_name: reid-triton-server
    restart: unless-stopped
    gpus: all
    shm_size: ${TRITON_SHM_SIZE:-1g}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${TRITON_NVIDIA_VISIBLE_DEVICES:-0}
    ports:
      - "${TRITON_HTTP_PORT:-8000}:8000"
      - "${TRITON_GRPC_PORT:-8001}:8001"
      - "${TRITON_METRICS_PORT:-8002}:8002"
    volumes:
      - ${TRITON_MODEL_REPOSITORY:-./artifacts/triton/market1501-vit-bnneck-v1/model_repository}:/models:ro
    command:
      - tritonserver
      - --model-repository=/models
      - --strict-model-config=false
      - --log-verbose=${TRITON_LOG_VERBOSE:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - mlops

  inference-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: ${API_IMAGE:-person-reid/inference-api:1.0.0}
    container_name: reid-inference-api
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      triton-server:
        condition: service_healthy
    environment:
      TRITON_URL: http://triton-server:8000
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-reid_reference_v1}
      TRITON_MODEL_NAME: ${TRITON_MODEL_NAME:-reid_embedding}
      TRITON_MODEL_VERSION: ${TRITON_MODEL_VERSION:-1}
      API_TRITON_MODEL_REPOSITORY: ${API_TRITON_MODEL_REPOSITORY:-artifacts/pipeline/market1501-vit-bnneck-v1-dvc/triton/model_repository}
      MODEL_MANIFEST_PATH: ${API_MODEL_MANIFEST_PATH:-artifacts/pipeline/market1501-vit-bnneck-v1-dvc/release/model_manifest.json}
      API_MAX_UPLOAD_BYTES: ${API_MAX_UPLOAD_BYTES:-10485760}
      API_MAX_IMAGE_PIXELS: ${API_MAX_IMAGE_PIXELS:-25000000}
      API_DEFAULT_TOP_K: ${API_DEFAULT_TOP_K:-5}
      API_MAX_TOP_K: ${API_MAX_TOP_K:-100}
      API_UPSTREAM_TIMEOUT_SECONDS: ${API_UPSTREAM_TIMEOUT_SECONDS:-30}
      API_MATCH_THRESHOLD: ${API_MATCH_THRESHOLD:-0.5}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./model_releases:/app/model_releases:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mlops

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: reid-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - mlops

  grafana:
    image: grafana/grafana:11.6.3
    container_name: reid-grafana
    restart: unless-stopped
    env_file:
      - .env.mlops
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - mlops

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: reid-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      - mlops

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: reid-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - mlops

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.1.1-4.0.4-ubuntu22.04
    container_name: reid-dcgm-exporter
    restart: unless-stopped
    gpus: all
    cap_add:
      - SYS_ADMIN
    networks:
      - mlops

volumes:
  postgres_data:
    name: reid-postgres-data
  minio_data:
    name: reid-minio-data
  prometheus_data:
    name: reid-prometheus-data
  grafana_data:
    name: reid-grafana-data

networks:
  mlops:
    name: reid-mlops-network
