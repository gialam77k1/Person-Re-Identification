name: person-reid-mlops

services:
  postgres:
    image: postgres:16.4-bookworm
    container_name: reid-postgres
    restart: unless-stopped
    env_file:
      - .env.mlops
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mlops

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: reid-minio
    restart: unless-stopped
    env_file:
      - .env.mlops
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mlops

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: reid-minio-init
    restart: "no"
    env_file:
      - .env.mlops
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MLFLOW_ARTIFACT_BUCKET}" &&
        mc mb --ignore-existing "local/$${DVC_BUCKET}" &&
        mc anonymous set none "local/$${MLFLOW_ARTIFACT_BUCKET}" &&
        mc anonymous set none "local/$${DVC_BUCKET}"
    networks:
      - mlops

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
      args:
        MLFLOW_BASE_IMAGE: ghcr.io/mlflow/mlflow:v3.10.0
    image: person-reid/mlflow:3.10.0
    container_name: reid-mlflow
    restart: unless-stopped
    env_file:
      - .env.mlops
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    command:
      - /bin/sh
      - -c
      - >-
        mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri "postgresql+psycopg2://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
        --serve-artifacts
        --artifacts-destination "s3://$${MLFLOW_ARTIFACT_BUCKET}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - mlops

volumes:
  postgres_data:
    name: reid-postgres-data
  minio_data:
    name: reid-minio-data

networks:
  mlops:
    name: reid-mlops-network
