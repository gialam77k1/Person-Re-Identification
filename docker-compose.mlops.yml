name: person-reid-mlops

services:
  postgres:
    image: postgres:16.4-bookworm
    container_name: reid-postgres
    restart: unless-stopped
    env_file:
      - .env.mlops
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mlops

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: reid-minio
    restart: unless-stopped
    env_file:
      - .env.mlops
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mlops

  minio-init:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
      args:
        MLFLOW_BASE_IMAGE: ghcr.io/mlflow/mlflow:v3.10.0
    image: person-reid/mlflow:3.10.0
    container_name: reid-minio-init
    restart: "no"
    env_file:
      - .env.mlops
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["python", "/opt/reid/init_minio_buckets.py"]
    networks:
      - mlops

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
      args:
        MLFLOW_BASE_IMAGE: ghcr.io/mlflow/mlflow:v3.10.0
    image: person-reid/mlflow:3.10.0
    container_name: reid-mlflow
    restart: unless-stopped
    env_file:
      - .env.mlops
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    command: ["python", "/opt/reid/start_mlflow_server.py"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - mlops

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: reid-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ${QDRANT_STORAGE_PATH:-./artifacts/qdrant/storage}:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mlops

  triton-server:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    container_name: reid-triton-server
    restart: unless-stopped
    gpus: all
    shm_size: ${TRITON_SHM_SIZE:-1g}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${TRITON_NVIDIA_VISIBLE_DEVICES:-0}
    ports:
      - "${TRITON_HTTP_PORT:-8000}:8000"
      - "${TRITON_GRPC_PORT:-8001}:8001"
      - "${TRITON_METRICS_PORT:-8002}:8002"
    volumes:
      - ${TRITON_MODEL_REPOSITORY:-./artifacts/triton/market1501-vit-bnneck-v1/model_repository}:/models:ro
    command:
      - tritonserver
      - --model-repository=/models
      - --strict-model-config=false
      - --log-verbose=${TRITON_LOG_VERBOSE:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - mlops

volumes:
  postgres_data:
    name: reid-postgres-data
  minio_data:
    name: reid-minio-data

networks:
  mlops:
    name: reid-mlops-network
