        pipeline.release_slug: market1501-vit-bnneck-v1-dvc
        train.enable_mlflow: true
        train.epochs: 50
      configs/vit_reid.yaml:
        augmentation:
          color_jitter: true
          random_erasing: true
          random_grayscale_p: 0.0
          random_affine_degrees: 5.0
          random_occlusion_p: 0.15
        data:
          source_type: image_folder
          dataset:
            name: market1501
          location:
            root: datasets/Market-1501-v15.09.15
            splits:
              train: bounding_box_train
              query: query
              gallery: bounding_box_test
          image_height: 224
          image_width: 224
          preserve_aspect_ratio: true
          batch_size: 16
          eval_batch_size: 32
          instances_per_identity: 4
        device: auto
        evaluation:
          use_rerank: true
          rerank_k1: 20
          rerank_k2: 6
          rerank_lambda: 0.3
          flip_test: true
        logging.tracking_uri: http://localhost:5000
        model:
          variant: vit
          backbone: vit_b_16
          pretrained: true
          embedding_dim: 512
          dropout: 0.1
          use_local_branch: true
          num_local_stripes: 4
          local_branch_dropout: 0.1
          use_bnneck: true
          use_auxiliary_branch_loss: true
        num_workers: 2
        seed: 42
        train:
          epochs: 50
          freeze_backbone_epochs: 5
          learning_rate: 5e-05
          backbone_lr_factor: 0.5
          weight_decay: 0.0005
          ce_weight: 1.0
          triplet_weight: 1.2
          triplet_margin: 0.35
          center_loss_weight: 0.0
          center_loss_lr: 0.25
          auxiliary_loss_weight: 0.3
          normalize_triplet_embeddings: true
          label_smoothing: 0.02
          scheduler_type: cosine
          warmup_epochs: 5
          min_lr_scale: 0.02
          grad_clip_norm: 1.0
          amp: true
          early_stopping:
            enabled: true
            patience: 12
            min_delta: 0.001
            monitor: mAP
    outs:
